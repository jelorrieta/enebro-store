<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Productos - Enebro</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>Administrador de Productos</h1>
            <nav class="admin-nav">
                <a href="../index.html" class="btn btn-secondary">Volver a Tienda</a>
            </nav>
        </header>

        <main class="admin-main">
            <!-- Sección de Crear Producto -->
            <section class="admin-section">
                <h2>Crear Nuevo Producto</h2>
                <form id="formCrearProducto" class="form-crear-producto">
                    <div class="form-group">
                        <label for="nombre">Nombre del Producto *</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="form-group">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" name="descripcion" rows="4"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="precio">Precio *</label>
                            <input type="number" id="precio" name="precio" step="0.01" required>
                        </div>

                        <div class="form-group">
                            <label for="sku">SKU</label>
                            <input type="text" id="sku" name="sku">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="categoria">Categoría</label>
                            <select id="categoria" name="categoria">
                                <option value="">Seleccionar categoría</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="imagen">URL de Imagen</label>
                            <input type="url" id="imagen" name="imagen">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="aromas">Aromas (separados por coma)</label>
                            <input type="text" id="aromas" name="aromas" placeholder="Ej: Lavanda, Eucalipto">
                        </div>

                        <div class="form-group">
                            <label for="colores">Colores (separados por coma)</label>
                            <input type="text" id="colores" name="colores" placeholder="Ej: Blanco, Azul">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Crear Producto</button>
                </form>
            </section>

            <!-- Sección de Listado de Productos -->
            <section class="admin-section">
                <h2>Listado de Productos</h2>
                
                <div class="filtros">
                    <input type="text" id="buscar" placeholder="Buscar productos..." class="input-buscar">
                    <select id="filtroCategoria" class="select-filtro">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>

                <div id="listaProductos" class="tabla-productos">
                    <p class="cargando">Cargando productos...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/modules/api.js"></script>
    <script src="../js/modules/productManager.js"></script>
    <script src="../js/admin/admin.js"></script>
</body>
</html>
